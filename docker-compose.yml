version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: db_portable
    ports:
      - "5432:5432"
    volumes:
      - postgres-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d db_portable"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pgt-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgt-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@pgt.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pgt-network

  postgres-init:
    image: postgres:16-alpine
    container_name: pgt-postgres-init
    environment:
      PGPASSWORD: admin
    command:
      - sh
      - -c
      - |
        psql -h postgres -U postgres -d db_portable -v ON_ERROR_STOP=1 \
          -c "CREATE SCHEMA IF NOT EXISTS administration;" \
          -c "CREATE SCHEMA IF NOT EXISTS inventory;" \
          -c "CREATE SCHEMA IF NOT EXISTS tracking;"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pgt-network
    restart: "no"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: pgt-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbitmq_stomp.listeners.1.port 61613"
    ports:
      - "5672:5672"
      - "15672:15672"
      - "61613:61613" 
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - pgt-network

  config-server:
    build:
      context: .
      dockerfile: config-server/Dockerfile
    image: pgt-config-server:latest
    container_name: pgt-config
    ports:
      - "8888:8888"
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8888/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: on-failure
    networks:
      - pgt-network

  discovery-server:
    build:
      context: .
      dockerfile: discovery-server/Dockerfile
    image: pgt-discovery-server:latest
    container_name: pgt-discovery
    ports:
      - "8761:8761"
    environment:
      SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888"
    depends_on:
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8761/eureka/apps || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: on-failure
    networks:
      - pgt-network

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    image: pgt-api-gateway:latest
    container_name: pgt-gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://discovery-server:8761/eureka/"
    depends_on:
      discovery-server:
        condition: service_healthy
    restart: on-failure
    networks:
      - pgt-network

  ms-inventory:
    build:
      context: .
      dockerfile: microservices/ms-inventory/Dockerfile
    image: pgt-ms-inventory:latest
    container_name: pgt-ms-inventory
    ports:
      - "8083:8083"
    environment:
      SERVER_PORT: "8083"
      SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://discovery-server:8761/eureka/"
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "false"
      EUREKA_INSTANCE_HOSTNAME: "ms-inventory"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/db_portable?currentSchema=inventory"
      SPRING_DATASOURCE_USERNAME: "postgres"
      SPRING_DATASOURCE_PASSWORD: "admin"
      SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
      SPRING_RABBITMQ_HOST: "rabbitmq"
      SPRING_RABBITMQ_PORT: "5672"
      SPRING_RABBITMQ_USERNAME: "guest"
      SPRING_RABBITMQ_PASSWORD: "guest"
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    restart: on-failure
    networks:
      - pgt-network

  ms-administration:
    build:
      context: .
      dockerfile: microservices/ms-administration/Dockerfile
    image: pgt-ms-administration:latest
    container_name: pgt-ms-admin
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: "8082"
      SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://discovery-server:8761/eureka/"
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "false"
      EUREKA_INSTANCE_HOSTNAME: "ms-administration"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/db_portable?currentSchema=administration"
      SPRING_DATASOURCE_USERNAME: "postgres"
      SPRING_DATASOURCE_PASSWORD: "admin"
      SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
      SPRING_RABBITMQ_HOST: "rabbitmq"
      SPRING_RABBITMQ_PORT: "5672"
      SPRING_RABBITMQ_USERNAME: "guest"
      SPRING_RABBITMQ_PASSWORD: "guest"
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    restart: on-failure
    networks:
      - pgt-network

  ms-tracking:
    build:
      context: .
      dockerfile: microservices/ms-tracking/Dockerfile
    image: pgt-ms-tracking:latest
    container_name: pgt-ms-tracking
    ports:
      - "8081:8081"
    environment:
      SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://discovery-server:8761/eureka/"
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "false"
      EUREKA_INSTANCE_HOSTNAME: "ms-tracking"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/db_portable?currentSchema=tracking"
      SPRING_DATASOURCE_USERNAME: "postgres"
      SPRING_DATASOURCE_PASSWORD: "admin"
      SPRING_RABBITMQ_HOST: "rabbitmq"
      SPRING_RABBITMQ_PORT: "5672"
      SPRING_RABBITMQ_USERNAME: "guest"
      SPRING_RABBITMQ_PASSWORD: "guest"
    depends_on:
      postgres-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    restart: on-failure
    networks:
      - pgt-network

networks:
  pgt-network:
    driver: bridge

volumes:
  postgres-db-data:
  pgadmin-data: